services:
  # Backend API
  - type: web
    name: the-schedule-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: static
          name: the-schedule-ui
          property: url
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # User must provide this in Render dashboard

  # Frontend UI
  - type: static
    name: the-schedule-ui
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: the-schedule-api
          property: url
